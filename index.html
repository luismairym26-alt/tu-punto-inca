  <style>
    :root {
      --bg-dark: #14130f;
      --bg-card: #1d1b15;
      --yellow: #f5d011;
      --yellow-hover: #e0bd0b;
      --cream-chat: #fbf8e8;
      --navy-user: #14223d;
      --text-white: #ffffff;
      --text-gray: #d4d2c9;
      --green-online: #25d366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-white);
      background-image: radial-gradient(#2c2817 1.5px, transparent 1.5px), radial-gradient(#2c2817 1.5px, #14130f 1.5px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      background-color: var(--yellow);
      color: #111;
      text-align: center;
      padding: 10px 15px;
      font-size: 0.85rem;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-bar a {
      color: #111;
      font-weight: 700;
      text-decoration: underline;
      display: inline-block;
      margin-top: 2px;
    }

    /* NAVBAR */
    header {
      background-color: rgba(20, 19, 15, 0.95);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(245, 208, 17, 0.15);
      position: sticky;
      top: 52px;
      z-index: 99;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-white);
    }

    .logo-circle {
      width: 44px;
      height: 44px;
      background-color: var(--yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-weight: 800;
      font-size: 0.52rem;
      text-align: center;
      line-height: 1.1;
      border: 2px solid #fff;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-white);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* HERO SECTION */
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 22px 60px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 208, 17, 0.1);
      border: 1px solid rgba(245, 208, 17, 0.45);
      color: var(--yellow);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.12;
      margin-bottom: 22px;
      max-width: 720px;
    }

    .hero h1 span {
      color: var(--yellow);
      position: relative;
      display: inline-block;
    }

    .hero h1 span::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 6px;
      background-color: var(--yellow);
      border-radius: 50%;
      transform: rotate(-1.5deg);
    }

    .hero p {
      color: var(--text-gray);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 600px;
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn-primary {
      background-color: var(--yellow);
      color: #111;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      border: 2px solid var(--yellow);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--yellow-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    /* SECCIONES GENERALES */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 22px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--text-white);
    }

    .section-title span {
      color: var(--yellow);
    }

    .section-subtitle {
      color: var(--text-gray);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* PLATOS FAVORITOS Y CARTA */
    .filter-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-gray);
      border: 1px solid rgba(245, 208, 17, 0.25);
      padding: 9px 18px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--yellow);
      color: #111;
      border-color: var(--yellow);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 20px;
    }

    .dish-card {
      background-color: var(--bg-card);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s;
      position: relative;
    }

    .dish-card:hover {
      transform: translateY(-4px);
      border-color: rgba(245, 208, 17, 0.45);
    }

    .fav-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--yellow);
      color: #111;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .cat-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(20, 19, 15, 0.85);
      color: var(--yellow);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 208, 17, 0.3);
      z-index: 2;
    }

    .dish-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #25221a;
    }

    .dish-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .dish-info h3 {
      font-size: 1.12rem;
      margin-bottom: 6px;
    }

    .dish-info p {
      font-size: 0.84rem;
      color: var(--text-gray);
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .dish-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .dish-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--yellow);
    }

    .add-btn {
      background: var(--yellow);
      color: #111;
      border: none;
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--yellow-hover);
    }

    /* UBICACIÓN EN TIEMPO REAL Y DELIVERY */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .info-box {
      background: var(--bg-card);
      border: 1px solid rgba(245, 208, 17, 0.2);
      border-radius: 18px;
      padding: 24px;
    }

    .info-box h3 {
      color: var(--yellow);
      margin-bottom: 12px;
      font-size: 1.2rem;
    }

    .info-list {
      list-style: none;
      color: var(--text-gray);
      font-size: 0.92rem;
      line-height: 1.8;
    }

    .info-list a {
      color: var(--yellow);
      text-decoration: none;
      font-weight: 600;
    }

    .pago-movil-card {
      background: rgba(245, 208, 17, 0.08);
      border: 1px dashed var(--yellow);
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .map-container {
      margin-top: 15px;
      border-radius: 14px;
      overflow: hidden;
      height: 220px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .geo-status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #a3e635;

background: rgba(163, 230, 53, 0.1);

}
/* BOTONES FLOTANTES */
.floating-stack {
position: fixed;
bottom: 22px;
right: 18px;
display: flex;
flex-direction: column;
align-items: center;
gap: 14px;
z-index: 998;
}
.bot-launcher {
position: relative;
width: 58px;
height: 58px;
border-radius: 50%;
background: var(--yellow);
border: 3px solid #fff;
box-shadow: 0 6px 20px rgba(0,0,0,0.5);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 0.56rem;
color: #111;
text-align: center;
line-height: 1.1;
transition: transform 0.2s;
}
.bot-launcher:hover {
transform: scale(1.07);
}
.notif-badge {
position: absolute;
top: -5px;
right: -4px;
background: #e11d48;
color: #fff;
width: 22px;
height: 22px;
border-radius: 50%;
font-size: 0.75rem;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
border: 2px solid #fff;
}
.chat-mini-icon {
position: absolute;
bottom: -4px;
right: -4px;
background: #14223d;
color: #fff;
width: 22px;
height: 22px;
border-radius: 50%;
font-size: 0.7rem;
display: flex;
align-items: center;
justify-content: center;
border: 2px solid #fff;
}
.wa-launcher {
width: 58px;
height: 58px;
border-radius: 50%;
background: var(--green-online);
color: #fff;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 6px 20px rgba(0,0,0,0.5);
text-decoration: none;
font-size: 1.8rem;
transition: transform 0.2s;
}
.wa-launcher:hover {
transform: scale(1.07);
}
/* =========================================
ASISTENTE VIRTUAL (ESTILO EXACTO CAPTURA)
========================================= */
.chat-window {
position: fixed;
bottom: 18px;
right: 18px;
width: 375px;
max-width: calc(100vw - 24px);
height: 610px;
max-height: calc(100vh - 36px);
background-color: var(--cream-chat);
border-radius: 22px;
box-shadow: 0 15px 40px rgba(0,0,0,0.65);
display: none;
flex-direction: column;
overflow: hidden;
z-index: 1000;
border: 1px solid rgba(0,0,0,0.15);
}
.chat-window.open {
display: flex;
animation: slideUp 0.25s ease;
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
.chat-header {
background-color: #14130f;
color: #fff;
padding: 14px 16px;
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 3px solid var(--yellow);
}
.chat-header-info {
display: flex;
align-items: center;
gap: 11px;
}
.chat-header-title h4 {
font-size: 1.02rem;
font-weight: 700;
}
.chat-header-title p {
font-size: 0.76rem;
color: #d4d2c9;
display: flex;
align-items: center;
gap: 6px;
}
.online-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background-color: var(--green-online);
display: inline-block;
}
.close-chat {
background: rgba(255,255,255,0.12);
border: none;
color: #fff;
width: 32px;
height: 32px;
border-radius: 50%;
font-size: 1.1rem;
cursor: pointer;
}
.chat-body {
flex: 1;
padding: 15px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 12px;
}
.msg-bot {
background: #ffffff;
color: #1a1a1a;
padding: 13px 15px;
border-radius: 16px 16px 16px 4px;
font-size: 0.88rem;
line-height: 1.48;
box-shadow: 0 2px 8px rgba(0,0,0,0.06);
max-width: 92%;
align-self: flex-start;
}
.msg-bot a {
color: #14223d;
font-weight: 700;
text-decoration: underline;
}
.msg-user {
background: var(--navy-user);
color: #ffffff;
padding: 10px 16px;
border-radius: 16px 16px 4px 16px;
font-size: 0.88rem;
font-weight: 500;
max-width: 80%;
align-self: flex-end;
box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
/* TARJETA DE PLATO DENTRO DEL CHAT */
.chat-dish-card {
background: #f5f2e6;
border-radius: 12px;
padding: 9px;
margin-top: 9px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
border: 1px solid rgba(0,0,0,0.06);
}
.chat-dish-left {
display: flex;
align-items: center;
gap: 9px;
}
.chat-dish-left img {
width: 48px;
height: 48px;
border-radius: 9px;
object-fit: cover;
flex-shrink: 0;
}
.chat-dish-meta h5 {
font-size: 0.84rem;
color: #111;
margin-bottom: 2px;
}
.chat-dish-meta span {
font-size: 0.86rem;
font-weight: 700;
color: #1e40af;
}
.chat-add-btn {
background: var(--yellow);
color: #111;
border: none;
padding: 6px 11px;
border-radius: 20px;
font-weight: 700;
font-size: 0.76rem;
cursor: pointer;
white-space: nowrap;
}
/* CHIPS DE RESPUESTA RÁPIDA */
.quick-chips {
display: flex;
flex-wrap: wrap;
gap: 7px;
padding: 6px 14px 10px;
background: var(--cream-chat);
}
.chip-btn {
background: #ffffff;
color: #14223d;
border: 1.5px solid #14223d;
padding: 6px 12px;
border-radius: 50px;
font-size: 0.78rem;
font-weight: 600;
cursor: pointer;
transition: all 0.15s;
}
.chip-btn:hover {
background: #14223d;
color: #fff;
}
/* BARRA DE CARRITO EN EL CHAT */
.cart-banner {
background: #14223d;
color: #fff;
padding: 8px 14px;
font-size: 0.8rem;
display: none;
justify-content: space-between;
align-items: center;
}
.cart-banner button {
background: var(--yellow);
color: #111;
border: none;
padding: 4px 10px;
border-radius: 12px;
font-weight: 700;
font-size: 0.75rem;
cursor: pointer;
}
/* INPUT DEL CHAT */
.chat-footer {
background: #ffffff;
padding: 10px 12px 8px;
border-top: 1px solid rgba(0,0,0,0.08);
}
.chat-input-row {
display: flex;
align-items: center;
gap: 8px;
}
.chat-input-row input {
flex: 1;
background: #efece0;
border: 1px solid rgba(0,0,0,0.1);
padding: 11px 16px;
border-radius: 50px;
font-size: 0.86rem;
outline: none;
font-family: inherit;
}
.send-btn {
width: 42px;
height: 42px;
border-radius: 50%;
background: var(--yellow);
color: #111;
border: none;
font-size: 1.1rem;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}
.chat-disclaimer {
text-align: center;
font-size: 0.72rem;
color: #555;
margin-top: 7px;
line-height: 1.3;
}
@media (max-width: 768px) {
.nav-links {
display: none;
position: absolute;
top: 72px;
left: 0;
width: 100%;
background: #14130f;
flex-direction: column;
padding: 20px;
border-bottom: 2px solid var(--yellow);
}
.nav-links.active {
display: flex;
}
.menu-toggle {
display: block;
}
}

let cart = [];
let userLocationLink = "";
// RENDERIZAR FAVORITOS Y CARTA
function renderMenus(filter = "todos") {
const favGrid = document.getElementById("favoritesGrid");
const fullGrid = document.getElementById("fullMenuGrid");
favGrid.innerHTML = menuItems
.filter(item => item.favorite)
.map(item => createDishCard(item, true))
.join("");
const filtered = filter === "todos"
? menuItems
: menuItems.filter(item => item.category === filter);
fullGrid.innerHTML = filtered
.map(item => createDishCard(item, false))
.join("");
}
function createDishCard(item, showFavBadge) {
return `

${showFavBadge ? '⭐ Favorito' : ''}
${item.category}



${item.name}

${item.desc}
$${item.price}
+ Agregar



`;
}
function filterMenu(category, btn) {
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
renderMenus(category);
}
// HORARIO AUTOMÁTICO (ABIERTO HASTA LAS 7 PM)
function checkRestaurantStatus() {
const now = new Date();
const hour = now.getHours();
const isOpen = hour >= 11 && hour < 19;
const heroText = document.getElementById("heroStatusText");
const heroDot = document.getElementById("heroStatusDot");
const chatLabel = document.getElementById("chatStatusLabel");
if (isOpen) {
heroText.textContent = "ABIERTO AHORA • HASTA LAS 7 PM";
heroDot.style.backgroundColor = "#f5d011";
chatLabel.textContent = "En línea · Restaurante abierto";
} else {
heroText.textContent = "CERRADO AHORA • ABRIMOS 11:30 AM";
heroDot.style.backgroundColor = "#ef4444";
chatLabel.textContent = "En línea · Recibiendo reservas";
}
}
// UBICACIÓN EN TIEMPO REAL
function getLiveLocation() {
const status = document.getElementById("geoStatus");
if (!navigator.geolocation) {
status.textContent = "⚠️ Tu navegador no soporta geolocalización.";
return;
}
status.textContent = "⏳ Obteniendo tu ubicación actual...";
navigator.geolocation.getCurrentPosition(
(pos) => {
const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
userLocationLink = https://google.com{lat},${lng};
status.innerHTML = ✅ Ubicación detectada. Se enviará automáticamente con tu pedido por WhatsApp.;
document.getElementById("mapFrame").src = https://google.com{lat},${lng}&output=embed;
},
() => {
status.textContent = "⚠️ No se pudo acceder al GPS. Puedes escribir tu dirección al hacer el pedido.";
}
);
}
// =========================================
// LÓGICA DEL ASISTENTE INCA
// =========================================
const chatWindow = document.getElementById("chatWindow");
const chatBody = document.getElementById("chatBody");
const quickChips = document.getElementById("quickChips");
let chatInitialized = false;
function openChat() {
chatWindow.classList.add("open");
document.getElementById("notifBadge").style.display = "none";
if (!chatInitialized) {
initChat();
chatInitialized = true;
}
}
function closeChat() {
chatWindow.classList.remove("open");
}
function initChat() {
addBotMessage(¡Hola! 👋 Soy el <strong>Asistente Inca</strong>. Te ayudo con el menú, precios, horario, ubicación o a <strong>armar tu pedido</strong>.<br><br> ✅ Abierto ahora · hasta las 7 pm.<br> ¿Qué se te antoja hoy?);
setChips(["🍽️ Ver menú", "⭐ Recomiéndame algo", "💳 Pago Móvil y ubicación"]);
}
function addBotMessage(html) {
const div = document.createElement("div");
div.className = "msg-bot";
div.innerHTML = html;
chatBody.appendChild(div);
chatBody.scrollTop = chatBody.scrollHeight;
}
function addUserMessage(text) {
const div = document.createElement("div");
div.className = "msg-user";
div.textContent = text;
chatBody.appendChild(div);
chatBody.scrollTop = chatBody.scrollHeight;
}
function setChips(options) {
quickChips.innerHTML = options
.map(opt => <button class="chip-btn" onclick="selectChip('${opt}')">${opt}</button>)
.join("");
}
function selectChip(option) {
const cleanText = option.replace(/^[^\w\sÁÉÍÓÚáéíóúÑñ]+\s*/, "");
addUserMessage(cleanText);
setTimeout(() => {
if (option.includes("Ver menú")) {
addBotMessage(🍽️ ¿Qué te provoca hoy? Elige una categoría:<br> <a href="#carta" onclick="closeChat()">o mira el menú completo en la página</a>);
setChips(["🥟 Entradas", "🐟 Del Mar", "🍗 Pollos a la leña", "🥘 Criollos", "🍝 Pastas"]);
}
else if (
option.includes("Entradas") ||
option.includes("Del Mar") ||
option.includes("Pollos a la leña") ||
option.includes("Criollos") ||
option.includes("Pastas")
) {
const catName = cleanText;
const items = menuItems.filter(i => i.category.toLowerCase() === catName.toLowerCase());
let cardsHtml = <strong>${option}:</strong>;
items.forEach(item => {
cardsHtml += <div class="chat-dish-card"> <div class="chat-dish-left"> <img src="${item.img}" alt="${item.name}" onerror="this.src='https://unsplash.com'"> <div class="chat-dish-meta"> <h5>${item.name}</h5> <span>$${item.price}</span> </div> </div> <button class="chat-add-btn" onclick="addToCart(${item.id})">+ Agregar</button> </div>;
});
addBotMessage(cardsHtml);
setChips(["🍽️ Ver menú", "⭐ Recomiéndame algo", "📲 Finalizar pedido"]);
}
else if (option.includes("Recomiéndame")) {
const favs = [menuItems, menuItems, menuItems]; // Ceviche, Trío Marino, Tallarines a la huancaína
let recHtml = ⭐ Nuestras especialidades más pedidas hoy:;
favs.forEach(fav => {
recHtml += <div class="chat-dish-card"> <div class="chat-dish-left"> <img src="${fav.img}" alt="${fav.name}" onerror="this.src='https://unsplash.com'"> <div class="chat-dish-meta"> <h5>${fav.name}</h5> <span>$${fav.price}</span> </div> </div> <button class="chat-add-btn" onclick="addToCart(${fav.id})">+ Agregar</button> </div>;
});
addBotMessage(recHtml);
setChips(["🍽️ Ver menú", "💳 Pago Móvil y ubicación"]);
}
else if (option.includes("Pago Móvil")) {
addBotMessage(💳 <strong>Datos Pago Móvil:</strong><br> • Cédula: <strong>25.433.809</strong><br> • Teléfono: <strong>0422-1009540</strong><br> • Banco: <strong>0102 (Venezuela)</strong><br><br> 🕒 <strong>Horario:</strong> Hasta las 7:00 PM.<br> 📞 <strong>Delivery:</strong> (0422) 100-9540);
setChips(["🍽️ Ver menú", "📍 Compartir mi GPS"]);
}
else if (option.includes("GPS")) {
getLiveLocation();
addBotMessage("📡 Solicitando tu ubicación GPS para enviarla junto con tu pedido...");
}
else if (option.includes("Finalizar") || option.includes("WhatsApp")) {
sendOrderToWhatsApp();
}
}, 300);
}
function handleKeyPress(e) {
if (e.key === "Enter") handleUserInput();
}
function handleUserInput() {
const input = document.getElementById("chatInput");
const text = input.value.trim();
if (!text) return;
addUserMessage(text);
input.value = "";
const lower = text.toLowerCase();
setTimeout(() => {
if (lower.includes("menu") || lower.includes("menú") || lower.includes("carta")) {
selectChip("🍽️ Ver menú");
} else if (lower.includes("entrada") || lower.includes("tequeño") || lower.includes("causa") || lower.includes("huancaina")) {
selectChip("🥟 Entradas");
} else if (lower.includes("ceviche") || lower.includes("mar") || lower.includes("tigre") || lower.includes("trio") || lower.includes("duo")) {
selectChip("🐟 Del Mar");
} else if (lower.includes("pollo") || lower.includes("leña") || lower.includes("mostro")) {
selectChip("🍗 Pollos a la leña");
} else if (lower.includes("chaufa") || lower.includes("lomo") || lower.includes("criollo") || lower.includes("aji") || lower.includes("anticucho") || lower.includes("alita")) {
selectChip("🥘 Criollos");
} else if (lower.includes("tallarin") || lower.includes("pasta") || lower.includes("verde")) {
selectChip("🍝 Pastas");
} else if (lower.includes("pago") || lower.includes("ubicacion") || lower.includes("movil") || lower.includes("móvil") || lower.includes("banco")) {
selectChip("💳 Pago Móvil y ubicación");
} else {
addBotMessage(¡Anotado! Si deseas confirmar tu pedido o hablar directo con nuestro equipo, puedes enviarlo por WhatsApp al <strong>(0422) 100-9540</strong> o explorar la carta:);
setChips(["🍽️ Ver menú", "📲 Enviar por WhatsApp"]);
}
}, 350);
}
// CARRITO DE PEDIDOS
function addToCart(id) {
const dish = menuItems.find(i => i.id === id);
if (!dish) return;
cart.push(dish);
const total = cart.reduce((sum, item) => sum + item.price, 0);
const banner = document.getElementById("cartBanner");
banner.style.display = "flex";
document.getElementById("cartSummaryText").textContent = 🛒 ${cart.length} plato(s) ($${total});
if (chatWindow.classList.contains("open")) {
addBotMessage(✅ Agregaste <strong>${dish.name}</strong> ($${dish.price}) a tu pedido. Total actual: <strong>$${total}</strong>.);
} else {
openChat();
setTimeout(() => {
addBotMessage(✅ Agregaste <strong>${dish.name}</strong> ($${dish.price}) a tu pedido. ¿Deseas agregar algo más o enviarlo por WhatsApp?);
setChips(["🍽️ Seguir viendo menú", "📲 Finalizar pedido"]);
}, 250);
}
}
function sendOrderToWhatsApp() {
let message = "Hola Tu Punto Inca, quiero realizar el siguiente pedido:%0A%0A";
if (cart.length > 0) {
cart.forEach((item, idx) => {
message += ${idx + 1}. ${item.name} - $${item.price}%0A;
});
const total = cart.reduce((sum, item) => sum + item.price, 0);
message += %0A*Total estimado:* $${total};
} else {
message += "Quisiera consultar disponibilidad de platos.";
}
if (userLocationLink) {
message += %0A%0A📍 *Mi ubicación en tiempo real:* ${encodeURIComponent(userLocationLink)};
}
window.open(https://wa.me{message}, "_blank");
}
function toggleMobileMenu() {
document.getElementById("navLinks").classList.toggle("active");
}
// INICIALIZAR
renderMenus();
checkRestaurantStatus();
</script>
